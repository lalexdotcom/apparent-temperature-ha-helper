name: Release

# The version in custom_components/apparent_temperature/manifest.json is the
# trigger: push a commit to `main` that carries a version no tag covers yet, and
# a green CI publishes it. Nothing is tagged by hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # `event == 'push'` is load-bearing: for a CI run triggered by a pull
    # request, `head_branch` is the *source* branch, so a PR onto `main` from a
    # branch called `main` in a fork would otherwise reach this job.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          version=$(jq -r .version custom_components/apparent_temperature/manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Is this version already released?
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already tagged — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION has no tag — releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # The version is matched exactly, pre-release suffix included: the
      # character class is what keeps `## 1.6.1` from matching `## 1.6.10`, or
      # `## 1.6.0` from swallowing `## 1.6.0-beta.1`. Refusing an absent section,
      # an empty one, or one still marked unreleased is what keeps an
      # in-progress version from being shipped by an accidental push.
      - name: Extract the changelog section
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          heading=$(awk -v ver="$VERSION" '
            index($0, "## " ver) == 1 {
              rest = substr($0, length("## " ver) + 1)
              if (rest == "" || rest ~ /^[^0-9A-Za-z.+-]/) { print; exit }
            }
          ' CHANGELOG.md)

          if [ -z "$heading" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

          case "$heading" in
            *nreleased*)
              echo "::error::CHANGELOG.md still marks $VERSION as unreleased"
              exit 1
              ;;
          esac

          awk -v ver="$VERSION" '
            found && /^## / { exit }
            found { print }
            index($0, "## " ver) == 1 {
              rest = substr($0, length("## " ver) + 1)
              if (rest == "" || rest ~ /^[^0-9A-Za-z.+-]/) { found = 1 }
            }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q "[^[:space:]]" release-notes.md; then
            echo "::error::CHANGELOG.md section for $VERSION is empty"
            exit 1
          fi

      # Pinned to a commit, not to `v2`: this job holds `contents: write`, and
      # HACS installs what it publishes. A moved tag would run someone else's
      # code with enough scope to publish a release to every user of the
      # integration. Bump the SHA and the comment together.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: steps.gate.outputs.release == 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: v${{ steps.version.outputs.version }}
          # The changelog section first, GitHub's own commit and contributor
          # summary appended under it — `generate_release_notes` adds to a body
          # rather than replacing it.
          body_path: release-notes.md
          generate_release_notes: true
          # No asset: HACS downloads custom_components/apparent_temperature
          # straight from the tag this release points at.
